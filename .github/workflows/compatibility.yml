name: Compatibility and privacy

on:
  push:
  pull_request:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-current-hermes:
    # stable = the newest Hermes release tag, which is what installs run; it must pass.
    # main = upstream's unreleased branch, an early warning that the patch needs a refresh
    # before the next release. It never fails the run (no daily red emails for drift).
    name: test-hermes-${{ matrix.hermes }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.hermes == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        hermes: [stable, main]
    steps:
      - name: Check out this pack with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the Hermes revision
        id: hermes
        run: |
          if [ "${{ matrix.hermes }}" = stable ]; then
            ref=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent.git 'v20*' \
              | awk -F/ '{print $NF}' | grep -E '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$' | sort -V | tail -1)
            [ -n "$ref" ] || { echo "No Hermes release tag found" >&2; exit 1; }
          else
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing against Hermes $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out Hermes Agent (${{ steps.hermes.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.ref }}
          path: hermes-agent
          fetch-depth: 1

      - name: Pick the Python this Hermes revision supports
        id: python
        # Releases and main differ (v2026.9.24: <3.14; main: <3.15), so read requires-python
        # and take the newest version it allows.
        run: |
          req=$(grep -m1 -E '^requires-python' hermes-agent/pyproject.toml | cut -d'"' -f2)
          version=$(python3 - "$req" <<'EOF'
          import operator, sys
          ops = {">=": operator.ge, "<=": operator.le, ">": operator.gt, "<": operator.lt, "==": operator.eq}
          def allowed(v):
              for part in filter(None, (p.strip() for p in sys.argv[1].split(","))):
                  op = next((o for o in (">=", "<=", "==", ">", "<") if part.startswith(o)), None)
                  bound = tuple(int(x) for x in part[len(op or ""):].strip().split(".")[:2])
                  if op and not ops[op](v, bound):
                      return False
              return True
          print(next(f"{a}.{b}" for a, b in ((3, 14), (3, 13), (3, 12), (3, 11)) if allowed((a, b))))
          EOF
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Hermes requires-python '$req' → Python $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m venv hermes-agent/.venv
          venv_python=hermes-agent/.venv/bin/python
          # pip 25.1+ reads PEP 735 dependency groups; the venv ships an older pip.
          "$venv_python" -m pip install --upgrade pip
          # Hermes moved its test tools from the [dev] extra to a [dependency-groups]
          # table in September 2026. Support both layouts.
          if grep -q '^\[dependency-groups\]' hermes-agent/pyproject.toml; then
            "$venv_python" -m pip install -e ./hermes-agent \
              --group ./hermes-agent/pyproject.toml:dev \
              --group ./hermes-agent/pyproject.toml:test
          else
            "$venv_python" -m pip install -e "./hermes-agent[dev]"
          fi
          # The pack's own helper scripts read YAML with PyYAML. Hermes switched
          # to ruamel.yaml and no longer installs PyYAML, so install it here.
          "$venv_python" -m pip install pyyaml
          echo "$GITHUB_WORKSPACE/hermes-agent/.venv/bin" >> "$GITHUB_PATH"
          # Point Hermes's test runner at this venv instead of its own activation.
          echo "HERMES_PYTHON=$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Test pack helper scripts
        run: |
          python -m py_compile scripts/*.py tests/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python -m pytest -q tests

      - name: Apply patches and run upstream-focused tests
        run: bash scripts/check-upstream-compat.sh hermes-agent

      - name: Scan working tree, index, and reachable history
        if: always()
        run: python scripts/privacy_scan.py --surface all
