name: Compatibility and privacy

on:
  push:
  pull_request:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-current-hermes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this pack with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out current Hermes Agent
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv hermes-agent/.venv
          hermes-agent/.venv/bin/python -m pip install -e "./hermes-agent[dev]"
          echo "$GITHUB_WORKSPACE/hermes-agent/.venv/bin" >> "$GITHUB_PATH"

      - name: Test pack helper scripts
        run: |
          python -m py_compile scripts/*.py tests/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python -m pytest -q tests

      - name: Apply patches and run upstream-focused tests
        run: bash scripts/check-upstream-compat.sh hermes-agent

      - name: Scan working tree, index, and reachable history
        if: always()
        run: python scripts/privacy_scan.py --surface all
